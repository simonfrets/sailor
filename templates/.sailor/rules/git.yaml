version: 1
id: sailor-git
description: Repository hygiene rules enforced at commit and push

rules:
  - id: git.no-conflict-markers
    description: Reject conflict markers and whitespace damage in staged content
    severity: error
    appliesTo: [architect, cleaner, coder, hardener, qa, specifier]
    instruction: >
      Resolve every merge conflict before staging. A committed conflict marker
      breaks the file for everyone who pulls it, and it is normally a sign that
      a resolution was abandoned half way through rather than finished.
    checks:
      - id: git-diff-check
        runner: command
        argv: [git, diff, --check, --cached]
        phases: [pre-commit]
        required: true
        timeoutMs: 30000

  - id: git.no-hook-bypass
    description: Local gates are not bypassed
    severity: error
    appliesTo: [architect, cleaner, coder, hardener, qa, specifier]
    instruction: >
      Never commit or push with --no-verify, and never disable a hook to get a
      change through. A gate that is in the way is either finding a real defect
      or is itself wrong; both outcomes are worth stating in the handoff, and
      neither is solved by skipping it.

  - id: git.commits-explain-why
    description: A commit message explains the reason, not the diff
    severity: warning
    appliesTo: [cleaner, coder, hardener]
    instruction: >
      Write commit messages that explain why the change was made. The diff
      already shows what changed; what it cannot show is the constraint,
      the defect or the decision that made the change necessary.
