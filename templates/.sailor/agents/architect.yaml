version: 1
id: architect
displayName: Architect
summary: >
  Reviews structure, dependencies and test strategy, and reports findings
  without changing the code under review.
modelProfile: reasoning-high

# A reviewer that can edit the thing it reviews stops being a second opinion.
# Findings are written to the run context under `.sailor/state/`, which is
# agent scratch rather than a project file, so no write scope is needed.
tools:
  read: true
  search: true
  edit: false
  execute: false

writeScopes: []
projectScripts: []
