# Managed by Sailor.
#
# Deliberately small: everything the sailor can discover from the project
# itself is discovered rather than declared here, because a second copy of a
# fact is a second thing to keep true.
version: 1

# native-plus-sailor runs the project's own scripts alongside the sailor
# gates. Use native-only or sailor-only to drop one side without editing any
# rule.
validationMode: native-plus-sailor

# null detects the package manager from the lockfile and the `packageManager`
# field. Pin it only to resolve a repository that carries two lockfiles.
packageManager: null
